name: PURIQ Market Chamber CI

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/puriq.yml
      - Dockerfile
      - app.py
      - puriq_market.py
      - szl_puriq.py
      - requirements*.txt
      - tests/**
      - README.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/puriq.yml
      - Dockerfile
      - app.py
      - puriq_market.py
      - szl_puriq.py
      - requirements*.txt
      - tests/**
      - README.md
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: puriq-market-chamber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test formulas, sources, API, UI, and container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install pinned runtime and test closure
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r requirements.txt -r requirements-test.txt

      - name: Compile and run complete contract suite
        env:
          PURIQ_SOURCE_REVISION: ${{ github.sha }}
        run: |
          python -m pip check
          python -m compileall -q app.py puriq_market.py szl_puriq.py tests
          python -m pytest tests -q

      - name: Build source-bound nonroot container
        run: >-
          docker build
          --build-arg PURIQ_SOURCE_REVISION="$GITHUB_SHA"
          --file Dockerfile
          --tag szl-puriq-market-chamber:test
          .

      - name: Close local runtime smoke routes
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run --detach --publish 127.0.0.1:7860:7860 szl-puriq-market-chamber:test)"
          trap 'docker logs "$cid" || true; docker rm --force "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:7860/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo '::error::PURIQ container readiness did not converge'
              exit 1
            fi
            sleep 1
          done
          for path in \
            / /healthz /readyz /api/build-info /.well-known/szl-source.json \
            /api/puriq/v1/anatomy /api/puriq/v1/formulas /api/puriq/v1/sources; do
            curl --fail --silent --show-error "http://127.0.0.1:7860${path}" >/dev/null
          done
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = szl
